name: Final runtime-owner composite AMD64 certification
on:
  push:
    branches: [certification/amd64-runtime-owner-20261012]
permissions:
  contents: read
concurrency:
  group: runtime-owner-release-amd64-20261012
  cancel-in-progress: false
jobs:
  broad:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      CERTIFICATION_GATE: native_reference_gate
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: x64
      - name: Isolated broad failure fingerprint, no image build
        run: bash harness/backend.sh
      - name: Retain textual broad-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: broad-fingerprint-${{ github.run_id }}
          path: evidence/
          retention-days: 3
  backend:
    needs: broad
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: x64
      - name: Frozen source, synthetic fixture, disposable PostgreSQL and backend gates
        run: bash harness/backend.sh
      - name: Retain sanitized textual gate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-backend-gate-${{ github.run_id }}
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.txt
            evidence/*.xml
            evidence/*.log
          retention-days: 3
  images:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        build: [1, 2]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      BUILD_NUMBER: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent AMD64 builds and disposable container gates
        run: bash harness/image/build.sh
      - name: Retain sanitized image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.build }}-${{ github.run_id }}
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.log
            evidence/*.xml
          retention-days: 3
      - name: Retain tested OCI bytes without registry publication
        uses: actions/upload-artifact@v4
        with:
          name: tested-oci-${{ matrix.build }}-${{ github.run_id }}
          path: images/*.oci.tar
          compression-level: 0
          retention-days: 3
  reproducibility:
    needs: [backend, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-evidence-*
          path: comparison
      - uses: actions/download-artifact@v4
        with:
          name: amd64-backend-gate-${{ github.run_id }}
          path: comparison/backend
      - uses: actions/download-artifact@v4
        with:
          name: broad-fingerprint-${{ github.run_id }}
          path: comparison/broad
      - name: Compare independent image identities
        run: python3 -B harness/image/compare.py comparison
      - uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ github.run_id }}
          path: |
            comparison/**/*.json
            comparison/**/*.jsonl
            comparison/**/*.txt
            comparison/**/*.xml
            comparison/**/*.log
          retention-days: 3
