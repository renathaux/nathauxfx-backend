name: Recovery deadline AMD64 recertification
on:
  push:
    branches: [certification/amd64-deadline-20261011]
permissions:
  contents: read
concurrency:
  group: deadline-release-amd64-20261011
  cancel-in-progress: false
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.3'
          architecture: x64
      - name: Frozen source, synthetic fixture, disposable PostgreSQL and backend gates
        run: bash harness/backend.sh
      - name: Retain sanitized textual gate evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd64-backend-gate-${{ github.run_id }}
          path: |
            evidence/*.json
            evidence/*.jsonl
            evidence/*.txt
            evidence/*.xml
            evidence/*.log
          retention-days: 3
  images:
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    strategy:
      fail-fast: false
      matrix:
        build: [1, 2]
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHON_DOTENV_DISABLED: '1'
      BUILD_NUMBER: ${{ matrix.build }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Independent AMD64 builds and disposable container gates
        run: bash harness/image/build.sh
      - name: Retain sanitized image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: image-evidence-${{ matrix.build }}-${{ github.run_id }}
          path: |
            evidence/*.json
            evidence/*.txt
            evidence/*.log
            evidence/*.xml
          retention-days: 3
      - name: Retain tested OCI bytes without registry publication
        uses: actions/upload-artifact@v4
        with:
          name: tested-oci-${{ matrix.build }}-${{ github.run_id }}
          path: images/*.oci.tar
          compression-level: 0
          retention-days: 3
  reproducibility:
    needs: [backend, images]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: image-evidence-*
          path: comparison
      - uses: actions/download-artifact@v4
        with:
          name: amd64-backend-gate-${{ github.run_id }}
          path: comparison/backend
      - name: Compare independent image identities
        run: python3 -B harness/image/compare.py comparison
      - uses: actions/upload-artifact@v4
        with:
          name: release-certification-${{ github.run_id }}
          path: |
            comparison/**/*.json
            comparison/**/*.jsonl
            comparison/**/*.txt
            comparison/**/*.xml
            comparison/**/*.log
          retention-days: 3
