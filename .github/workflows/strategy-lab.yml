name: Strategy Lab checks

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/services/strategy_lab/**"
      - "Backend/routes/strategy_lab.py"
      - "Backend/tests/test_strategy_lab*.py"
      - ".github/workflows/strategy-lab.yml"

jobs:
  strategy-lab-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Strategy Lab safety and strategy tests
        run: |
          python -m pytest -q tests/test_strategy_lab.py tests/test_strategy_lab_v2.py
