name: Phase 1.2 hotfix check

on:
  pull_request:
    branches: [main]

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: broker_test
          POSTGRES_PASSWORD: broker_test
          POSTGRES_DB: broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Phase 1.2 focused safety suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_broker_integration_test.py \
            tests/test_broker_integration_test_adapter.py \
            tests/test_ready_execution_handoff.py \
            tests/test_phase12_ctrader_rollover_gap.py \
            tests/test_indicator_event_stream.py \
            tests/test_indicator_stream_origin_boundary.py \
            tests/test_indicator_stream_account_scope.py \
            tests/test_phase_1_2_final_audit.py \
            tests/test_database_configuration.py \
            tests/test_smc_strategy_authority.py \
            tests/test_xauusd_risk_guard.py \
            tests/test_neon_observer_optimization.py \
            tests/test_v3b_strategy_settings_sync.py \
            tests/test_v3b_5m_stream_recovery.py \
            tests/test_v3b_5m_stream_recovery_rollover_gaps.py \
            tests/test_v3b_15m_stream_recovery.py \
            tests/test_v3b_1h_stream_recovery.py \
            tests/test_v3b_recovery_cli.py \
            tests/test_ctrader_live_stream_startup.py \
            tests/test_chart_closed_candle_fallback.py \
            tests/test_dashboard_display_fallback.py \
            tests/test_indicator_candle_display_reader.py

      - name: Check broker coordination across PostgreSQL processes
        env:
          DATABASE_URL: "sqlite:///:memory:"
          BROKER_TEST_POSTGRES_URL: "postgresql://broker_test:broker_test@127.0.0.1:5432/broker_test"
        run: python -m pytest -q tests/test_broker_integration_test_postgres.py
