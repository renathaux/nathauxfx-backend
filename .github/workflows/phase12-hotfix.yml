name: Phase 1.2 hotfix check

on:
  pull_request:
    branches: [main]

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Phase 1.2 focused safety suite
        run: |
          python -m pytest -q \
            tests/test_phase12_ctrader_rollover_gap.py \
            tests/test_indicator_event_stream.py \
            tests/test_phase_1_2_final_audit.py \
            tests/test_database_configuration.py \
            tests/test_smc_strategy_authority.py \
            tests/test_xauusd_risk_guard.py \
            tests/test_neon_observer_optimization.py \
            tests/test_v3b_strategy_settings_sync.py
