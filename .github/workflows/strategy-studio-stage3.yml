name: Strategy Studio Stage 3

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  parity-shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Stage 3 parity and V3B regressions
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_parity.py \
            tests/test_strategy_studio_real_history_parity_snapshot.py \
            tests/test_strategy_studio_submission.py \
            tests/test_strategy_studio_live_candidate.py \
            tests/test_strategy_studio_live_handoff.py \
            tests/test_strategy_engine_evaluator.py \
            tests/test_strategy_engine_market_facts.py \
            tests/test_strategy_lab_v3b.py \
            tests/test_strategy_lab_v3b_choch_acceptance.py

  task5-api-apply:
    if: "${{ github.head_ref == 'feat/strategy-studio-v3b-live-handoff' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: "${{ github.head_ref }}"
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Apply Task 5 API patch when needed
        run: |
          if grep -q "def select_auto_execution_candidate" Backend/api.py; then
            echo "Task 5 API wiring already present"
          else
            python -c 'from pathlib import Path; p=Path("scripts/apply_task5_api_patch.py"); t=p.read_text(encoding="utf-8"); old="    if count != 1:\n"; new="    if count != 1 and not (label == \"preserve Studio setup id\" and count == 2):\n"; assert t.count(old) == 1; t=t.replace(old, new, 1); guard="        assert_current_selection(identity)\n"; assert t.count(guard) == 2; t=t.replace(guard, "", 2); p.write_text(t, encoding="utf-8")'
            python scripts/apply_task5_api_patch.py
          fi

      - name: Syntax check
        run: python -m py_compile Backend/api.py Backend/services/strategy_studio_live_candidate.py Backend/services/strategy_studio_live_state.py Backend/services/strategy_studio_execution_adapter.py

      - name: Run Task 5 focused safety suite
        working-directory: Backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_live_handoff.py \
            tests/test_strategy_studio_submission.py \
            tests/test_ready_execution_handoff.py \
            tests/test_simple_account_switch.py \
            tests/test_phase_1_2_final_audit.py \
            tests/test_indicator_event_stream.py \
            tests/test_indicator_stream_account_scope.py

      - name: Commit verified API wiring
        run: |
          if git diff --quiet -- Backend/api.py; then
            echo "No API patch to commit"
            exit 0
          fi
          git config user.name "renathaux"
          git config user.email "charlesdieufort2@gmail.com"
          git add Backend/api.py
          git diff --cached --check
          git commit -m "feat: wire gated Strategy Studio LIVE handoff"
          git push origin HEAD:feat/strategy-studio-v3b-live-handoff
