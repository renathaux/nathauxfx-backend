name: Strategy Studio Stage 3

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/strategy-studio-v3b-live-handoff]

jobs:
  parity-shadow-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Stage 3 parity, handoff, management, and V3B regressions
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_parity.py \
            tests/test_strategy_studio_real_history_parity_snapshot.py \
            tests/test_strategy_studio_submission.py \
            tests/test_strategy_studio_live_candidate.py \
            tests/test_strategy_studio_live_handoff.py \
            tests/test_strategy_studio_position_manager.py \
            tests/test_strategy_studio_account_switch.py \
            tests/test_strategy_engine_evaluator.py \
            tests/test_strategy_engine_market_facts.py \
            tests/test_strategy_lab_v3b.py \
            tests/test_strategy_lab_v3b_choch_acceptance.py

  task5-full-safety:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: broker_test
          POSTGRES_PASSWORD: broker_test
          POSTGRES_DB: broker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U broker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Syntax check Task 5 wiring
        run: |
          python -m py_compile api.py services/strategy_studio_live_candidate.py services/strategy_studio_live_state.py services/strategy_studio_execution_adapter.py services/strategy_studio_position_manager.py services/trade_submission_service.py

      - name: Run Task 5 focused handoff safety
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_live_handoff.py \
            tests/test_strategy_studio_submission.py \
            tests/test_strategy_studio_position_manager.py \
            tests/test_strategy_studio_account_switch.py \
            tests/test_ready_execution_handoff.py \
            tests/test_simple_account_switch.py

      - name: Run Stage 2 regression suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_schema.py \
            tests/test_strategy_studio_service.py \
            tests/test_strategy_studio_routes.py \
            tests/test_strategy_engine_market_facts.py \
            tests/test_strategy_engine_evaluator.py \
            tests/test_strategy_simulator.py \
            tests/test_strategy_simulator_routes.py \
            tests/test_simple_account_switch.py \
            tests/test_ready_execution_handoff.py

      - name: Run Phase 1.2 focused safety suite
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_broker_integration_test.py \
            tests/test_broker_integration_test_adapter.py \
            tests/test_ready_execution_handoff.py \
            tests/test_phase12_ctrader_rollover_gap.py \
            tests/test_indicator_event_stream.py \
            tests/test_indicator_stream_origin_boundary.py \
            tests/test_indicator_stream_account_scope.py \
            tests/test_phase_1_2_final_audit.py \
            tests/test_database_configuration.py \
            tests/test_smc_strategy_authority.py \
            tests/test_xauusd_risk_guard.py \
            tests/test_neon_observer_optimization.py \
            tests/test_v3b_strategy_settings_sync.py \
            tests/test_v3b_5m_stream_recovery.py \
            tests/test_v3b_5m_stream_recovery_rollover_gaps.py \
            tests/test_v3b_15m_stream_recovery.py \
            tests/test_v3b_1h_stream_recovery.py \
            tests/test_v3b_recovery_cli.py \
            tests/test_ctrader_live_stream_startup.py \
            tests/test_chart_closed_candle_fallback.py \
            tests/test_dashboard_display_fallback.py \
            tests/test_indicator_candle_display_reader.py

      - name: Check broker coordination across PostgreSQL processes
        env:
          DATABASE_URL: "sqlite:///:memory:"
          BROKER_TEST_POSTGRES_URL: "postgresql://broker_test:broker_test@127.0.0.1:5432/broker_test"
        run: python -m pytest -q tests/test_broker_integration_test_postgres.py
