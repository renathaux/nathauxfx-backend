name: Tick research safety check

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/routes/ctrader.py"
      - "Backend/tests/test_tick_research_window.py"
      - ".github/workflows/tick-research.yml"

jobs:
  focused-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run tick research isolation tests
        run: python -m pytest -q tests/test_tick_research_window.py tests/test_m1_research_window.py
