name: Gold tick final audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/gold-tick-final-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve final three Gold V3B trades from cTrader ticks
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          ROOT = "https://flowsignal-backend-3.onrender.com"
          TICKS = ROOT + "/chart/ticks-window"
          M1 = ROOT + "/chart/candles-window"
          cases = [
              {"seq":11,"quote":"bid","start":"2026-08-25T00:00:00Z","end":"2026-08-25T00:01:00Z","side":"BUY","sl":4646.52,"trigger":4683.17,"protected":4680.18,"tp2":4692.14},
              {"seq":15,"quote":"ask","start":"2026-08-27T10:02:00Z","end":"2026-08-27T10:03:00Z","side":"SELL","sl":4612.13,"trigger":4576.13,"protected":4579.07,"tp2":4567.33},
              {"seq":22,"quote":"ask","start":"2026-09-01T08:06:00Z","end":"2026-09-01T08:07:00Z","side":"SELL","sl":4449.45,"trigger":4408.16,"protected":4411.53,"tp2":4398.06},
          ]

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def iso(value):
              return value.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")

          def get_json(url, params):
              req = urllib.request.Request(
                  url + "?" + urllib.parse.urlencode(params),
                  headers={"User-Agent":"FlowSignal-Gold-Tick-Audit/2.0"},
              )
              with urllib.request.urlopen(req, timeout=45) as response:
                  return json.loads(response.read().decode("utf-8"))

          def fetch_ticks(case, start, end):
              payload = get_json(TICKS, {
                  "symbol":"XAUUSD", "quote":case["quote"],
                  "start":iso(start), "end":iso(end),
              })
              if not payload.get("pagination_complete", False):
                  raise RuntimeError(f"incomplete tick pagination for seq {case['seq']}")
              return payload.get("ticks") or []

          def fetch_m1(start, end):
              try:
                  payload = get_json(M1, {
                      "symbol":"XAUUSD", "timeframe":"1m",
                      "start":iso(start), "end":iso(end),
                  })
              except urllib.error.HTTPError as exc:
                  if exc.code == 503:
                      return []
                  raise
              return payload.get("candles") or []

          def unarmed_tick_resolution(case, ticks):
              armed = False
              armed_ts = None
              for tick in ticks:
                  p, ts = float(tick["price"]), tick["timestamp"]
                  if not armed:
                      if case["side"] == "BUY":
                          if p <= case["sl"]: return "LOSS", ts, armed_ts
                          if p >= case["tp2"]: return "FULL", ts, ts
                          if p >= case["trigger"]:
                              armed, armed_ts = True, ts
                      else:
                          if p >= case["sl"]: return "LOSS", ts, armed_ts
                          if p <= case["tp2"]: return "FULL", ts, ts
                          if p <= case["trigger"]:
                              armed, armed_ts = True, ts
                  else:
                      if case["side"] == "BUY":
                          if p >= case["tp2"]: return "FULL", ts, armed_ts
                          if p <= case["protected"]: return "PROTECTED", ts, armed_ts
                      else:
                          if p <= case["tp2"]: return "FULL", ts, armed_ts
                          if p >= case["protected"]: return "PROTECTED", ts, armed_ts
              return ("ARMED_NO_EXIT" if armed else "NO_DECISION"), None, armed_ts

          def armed_tick_resolution(case, ticks):
              for tick in ticks:
                  p, ts = float(tick["price"]), tick["timestamp"]
                  if case["side"] == "BUY":
                      if p >= case["tp2"]: return "FULL", ts
                      if p <= case["protected"]: return "PROTECTED", ts
                  else:
                      if p <= case["tp2"]: return "FULL", ts
                      if p >= case["protected"]: return "PROTECTED", ts
              return None, None

          def continue_armed(case, cursor, days=7):
              deadline = cursor + timedelta(days=days)
              while cursor < deadline:
                  chunk_end = min(cursor + timedelta(days=1), deadline)
                  candles = fetch_m1(cursor, chunk_end)
                  for candle in candles:
                      high, low = float(candle["high"]), float(candle["low"])
                      if case["side"] == "BUY":
                          tp = high >= case["tp2"]
                          protected = low <= case["protected"]
                      else:
                          tp = low <= case["tp2"]
                          protected = high >= case["protected"]
                      if not tp and not protected:
                          continue
                      candle_start = parse(candle["timestamp"])
                      if tp and protected:
                          exact = fetch_ticks(case, candle_start, candle_start + timedelta(minutes=1))
                          result, ts = armed_tick_resolution(case, exact)
                          if result:
                              return result, ts
                          raise RuntimeError(f"touching M1 candle did not resolve from ticks: seq {case['seq']} {candle['timestamp']}")
                      return ("FULL", candle["timestamp"]) if tp else ("PROTECTED", candle["timestamp"])
                  cursor = chunk_end
              return "ARMED_UNRESOLVED_7D", None

          outcomes = []
          for case in cases:
              start, end = parse(case["start"]), parse(case["end"])
              initial_ticks = fetch_ticks(case, start, end)
              result, decision_ts, armed_ts = unarmed_tick_resolution(case, initial_ticks)
              if result == "ARMED_NO_EXIT":
                  result, decision_ts = continue_armed(case, end)
              row = {
                  "seq":case["seq"], "side":case["side"], "quote":case["quote"],
                  "initial_tick_count":len(initial_ticks), "armed_ts":armed_ts,
                  "result":result, "decision_ts":decision_ts,
              }
              outcomes.append(row)
              print("GOLD_TICK_FINAL_CASE", json.dumps(row, separators=(",", ":")))

          unresolved = [r for r in outcomes if r["result"] not in {"FULL","PROTECTED","LOSS"}]
          if unresolved:
              raise RuntimeError("tick audit unresolved: " + json.dumps(unresolved))

          mapping = {"FULL":1.90, "PROTECTED":1.14, "LOSS":-1.0}
          added_r = sum(mapping[r["result"]] for r in outcomes)
          final_gold_r = 3.96 + added_r
          summary = {
              "outcomes":{str(r["seq"]):r["result"] for r in outcomes},
              "three_tick_resolved_r":round(added_r, 2),
              "previously_classified_24_r":3.96,
              "final_27_trade_gold_r":round(final_gold_r, 2),
              "at_100_risk_dollars":round(final_gold_r * 100, 2),
          }
          print("GOLD_TICK_FINAL_SUMMARY", json.dumps(summary, separators=(",", ":")))
          PY
