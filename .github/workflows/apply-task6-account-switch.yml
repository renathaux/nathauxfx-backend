name: Apply Task 6 Account Switch

on:
  push:
    branches: [feat/strategy-studio-v3b-live-handoff]
    paths:
      - scripts/apply_task6_account_switch.py

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/strategy-studio-v3b-live-handoff
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        working-directory: Backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Apply account-switch patch
        run: python scripts/apply_task6_account_switch.py

      - name: Syntax check
        run: python -m py_compile Backend/api.py Backend/services/strategy_studio_position_manager.py Backend/services/strategy_studio_service.py

      - name: Run Task 6 focused tests
        working-directory: Backend
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_position_manager.py \
            tests/test_strategy_studio_account_switch.py \
            tests/test_strategy_studio_live_handoff.py \
            tests/test_simple_account_switch.py

      - name: Commit only after focused suite passes
        run: |
          rm scripts/apply_task6_account_switch.py
          rm .github/workflows/apply-task6-account-switch.yml
          git config user.name "renathaux"
          git config user.email "charlesdieufort2@gmail.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: suspend and resume Studio management on account switch"
          git push origin HEAD:feat/strategy-studio-v3b-live-handoff
