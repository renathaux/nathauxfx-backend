name: Strategy Studio Simulator checks

on:
  pull_request:
    branches: [main]
    paths:
      - "Backend/services/strategy_engine/**"
      - "Backend/services/strategy_simulator*.py"
      - "Backend/routes/strategy_simulator.py"
      - "Backend/tests/test_strategy_engine_*.py"
      - "Backend/tests/test_strategy_simulator*.py"
      - "Backend/api.py"
      - ".github/workflows/strategy-studio-simulator.yml"

jobs:
  simulator-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run Strategy Studio simulator tests
        run: |
          PYTHONDONTWRITEBYTECODE=1 python -m pytest -q tests/test_strategy_engine_market_facts.py
