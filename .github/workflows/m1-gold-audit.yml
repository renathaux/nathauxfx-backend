name: Gold M1 ambiguity audit

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/m1-gold-audit.yml"

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve Gold V3B ambiguous M5 bars with production M1 history
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone

          BASE = "https://flowsignal-backend-3.onrender.com/chart/candles-window"
          cases = [
              {"seq":1,"start":"2026-08-14T12:25:00Z","end":"2026-08-14T12:30:00Z","side":"BUY","sl":4347.36,"trigger":4380.40,"protected":4377.71,"tp2":4388.48},
              {"seq":4,"start":"2026-08-18T23:30:00Z","end":"2026-08-18T23:35:00Z","side":"SELL","sl":4359.09,"trigger":4328.31,"protected":4330.82,"tp2":4320.78},
              {"seq":5,"start":"2026-08-19T12:35:00Z","end":"2026-08-19T12:40:00Z","side":"BUY","sl":4323.92,"trigger":4396.87,"protected":4390.92,"tp2":4414.72},
              {"seq":7,"start":"2026-08-20T12:00:00Z","end":"2026-08-20T12:05:00Z","side":"SELL","sl":4503.67,"trigger":4459.98,"protected":4463.55,"tp2":4449.30},
              {"seq":8,"start":"2026-08-21T09:05:00Z","end":"2026-08-21T09:10:00Z","side":"BUY","sl":4544.91,"trigger":4591.04,"protected":4587.28,"tp2":4602.33},
              {"seq":11,"start":"2026-08-25T00:00:00Z","end":"2026-08-25T00:05:00Z","side":"BUY","sl":4646.52,"trigger":4683.17,"protected":4680.18,"tp2":4692.14},
              {"seq":12,"start":"2026-08-25T13:25:00Z","end":"2026-08-25T13:30:00Z","side":"SELL","sl":4680.45,"trigger":4612.25,"protected":4617.81,"tp2":4595.57},
              {"seq":14,"start":"2026-08-26T13:15:00Z","end":"2026-08-26T13:20:00Z","side":"SELL","sl":4641.84,"trigger":4606.42,"protected":4609.31,"tp2":4597.76},
              {"seq":15,"start":"2026-08-27T10:00:00Z","end":"2026-08-27T10:05:00Z","side":"SELL","sl":4612.13,"trigger":4576.13,"protected":4579.07,"tp2":4567.33},
              {"seq":22,"start":"2026-09-01T08:05:00Z","end":"2026-09-01T08:10:00Z","side":"SELL","sl":4449.45,"trigger":4408.16,"protected":4411.53,"tp2":4398.06},
              {"seq":24,"start":"2026-09-03T04:05:00Z","end":"2026-09-03T04:10:00Z","side":"BUY","sl":4393.35,"trigger":4433.54,"protected":4430.27,"tp2":4443.38},
              {"seq":26,"start":"2026-09-09T06:00:00Z","end":"2026-09-09T06:05:00Z","side":"BUY","sl":4375.70,"trigger":4403.38,"protected":4401.12,"tp2":4410.15},
              {"seq":27,"start":"2026-09-10T12:30:00Z","end":"2026-09-10T12:35:00Z","side":"SELL","sl":4391.11,"trigger":4347.84,"protected":4351.37,"tp2":4337.26},
          ]

          def iso(dt):
              return dt.astimezone(timezone.utc).isoformat().replace("+00:00", "Z")

          def parse(value):
              return datetime.fromisoformat(value.replace("Z", "+00:00"))

          def fetch_window(start, end):
              qs = urllib.parse.urlencode({
                  "symbol":"XAUUSD","timeframe":"1m","start":iso(start),"end":iso(end),
              })
              req = urllib.request.Request(BASE + "?" + qs, headers={"User-Agent":"FlowSignal-M1-Audit/2.0"})
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      return (json.loads(response.read().decode("utf-8")).get("candles") or [])
              except urllib.error.HTTPError as exc:
                  if exc.code == 503:  # closed-market/no-candle chunk
                      return []
                  raise

          def touches(case, candle):
              hi, lo = float(candle["high"]), float(candle["low"])
              if case["side"] == "BUY":
                  return {
                      "stop": lo <= case["sl"], "trigger": hi >= case["trigger"],
                      "protected": lo <= case["protected"], "tp2": hi >= case["tp2"],
                  }
              return {
                  "stop": hi >= case["sl"], "trigger": lo <= case["trigger"],
                  "protected": hi >= case["protected"], "tp2": lo <= case["tp2"],
              }

          def resolve_unarmed(case, candles):
              armed = False
              armed_ts = None
              for c in candles:
                  hit = touches(case, c)
                  if not armed:
                      if hit["stop"] and (hit["trigger"] or hit["tp2"]):
                          return "AMBIGUOUS_M1", c["timestamp"], False, None
                      if hit["tp2"] and hit["protected"]:
                          return "AMBIGUOUS_M1", c["timestamp"], False, None
                      if hit["tp2"]:
                          return "FULL", c["timestamp"], False, None
                      if hit["stop"]:
                          return "LOSS", c["timestamp"], False, None
                      if hit["trigger"] and hit["protected"]:
                          return "AMBIGUOUS_M1", c["timestamp"], False, None
                      if hit["trigger"]:
                          armed = True
                          armed_ts = c["timestamp"]
                          continue
                  else:
                      if hit["protected"] and hit["tp2"]:
                          return "AMBIGUOUS_M1", c["timestamp"], True, armed_ts
                      if hit["tp2"]:
                          return "FULL", c["timestamp"], True, armed_ts
                      if hit["protected"]:
                          return "PROTECTED", c["timestamp"], True, armed_ts
              return ("ARMED_NO_EXIT" if armed else "NO_DECISION"), None, armed, armed_ts

          def continue_armed(case, cursor, days=7):
              deadline = cursor + timedelta(days=days)
              while cursor < deadline:
                  chunk_end = min(cursor + timedelta(hours=6), deadline)
                  candles = fetch_window(cursor, chunk_end)
                  for c in candles:
                      hit = touches(case, c)
                      if hit["protected"] and hit["tp2"]:
                          return "AMBIGUOUS_M1", c["timestamp"]
                      if hit["tp2"]:
                          return "FULL", c["timestamp"]
                      if hit["protected"]:
                          return "PROTECTED", c["timestamp"]
                  cursor = chunk_end
              return "ARMED_UNRESOLVED_7D", None

          results = []
          for case in cases:
              start, end = parse(case["start"]), parse(case["end"])
              first_candles = fetch_window(start, end)
              result, decision_ts, armed, armed_ts = resolve_unarmed(case, first_candles)
              if result == "ARMED_NO_EXIT":
                  result, decision_ts = continue_armed(case, end)
              row = {
                  "seq": case["seq"], "initial_window": [case["start"], case["end"]],
                  "initial_m1_count": len(first_candles), "armed_ts": armed_ts,
                  "result": result, "decision_ts": decision_ts,
              }
              results.append(row)
              print("M1_FINAL_CASE", json.dumps(row, separators=(",", ":")))

          counts = {}
          for row in results:
              counts[row["result"]] = counts.get(row["result"], 0) + 1
          known_nonambiguous_r = 2 * 1.14 - 12
          resolved_ambiguous_r = sum(
              1.90 if r["result"] == "FULL" else
              1.14 if r["result"] == "PROTECTED" else
              -1.0 if r["result"] == "LOSS" else 0.0
              for r in results
          )
          summary = {
              "counts": counts,
              "known_nonambiguous_r": round(known_nonambiguous_r, 2),
              "resolved_ambiguous_r": round(resolved_ambiguous_r, 2),
              "known_total_r_excluding_remaining_m1_ambiguity": round(known_nonambiguous_r + resolved_ambiguous_r, 2),
          }
          print("M1_FINAL_AUDIT_SUMMARY", json.dumps(summary, separators=(",", ":")))
          PY
