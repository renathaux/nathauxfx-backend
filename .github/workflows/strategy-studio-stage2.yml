name: Strategy Studio Stage 2

on:
  pull_request:
    branches: [main]

jobs:
  stage2-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest httpx2

      - name: Run Strategy Studio Stage 2 and regression tests
        env:
          DATABASE_URL: "sqlite:///:memory:"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -c 'import sys, pytest; from db import Base, engine; import models; Base.metadata.create_all(engine); sys.exit(pytest.main(sys.argv[1:]))' -q \
            tests/test_strategy_studio_schema.py \
            tests/test_strategy_studio_service.py \
            tests/test_strategy_studio_routes.py \
            tests/test_strategy_engine_market_facts.py \
            tests/test_strategy_engine_evaluator.py \
            tests/test_strategy_simulator.py \
            tests/test_strategy_simulator_routes.py \
            tests/test_simple_account_switch.py \
            tests/test_ready_execution_handoff.py
