name: AMD64 dependency certification

on:
  push:
    branches:
      - certification/security-clean-167d1e3-amd64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd64-certification-security-clean-167d1e3
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: certification-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      EXPECTED_SNAPSHOT_PARENT: 2f3c933c35c4e0deaf0de97971b3ec9bf7b1d936
      EXPECTED_PACKAGING_SOURCE_SHA: 167d1e3a50de99a56fcb471c1c67b15838bc284b
      EXPECTED_SOURCE_MANIFEST_SHA256: 51e8540b1b2be9804ce2cbccbf753aa41c4f1eb041d7329312c29968a940af1b
      EXPECTED_LOCK_SHA256: 1d8e368b5645db69cab33479c56d7db0827155898368a419fc80ab9819ee5736
      EXPECTED_METADATA_SHA256: 8e24bda82fa3cc5bdcf21f19c86eec85eae74e24e115a402066bfafe884e5e89
      DATABASE_URL: sqlite:///:memory:
      VERIFIER_TEST_PG_DSN: postgresql+psycopg2://postgres:certification-test-only@127.0.0.1:5432/postgres
      CUTOVER_DATABASE_URL: postgresql+psycopg2://postgres:certification-test-only@127.0.0.1:5432/postgres
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      JWT_SECRET_KEY: certification-jwt-test-only
      ADMIN_TOKEN: certification-admin-test-only
      TWELVE_DATA_API_KEY: certification-twelve-data-test-only
      STRATEGY_LIVE_INTEGRITY_VERIFY_ENABLED: "0"

    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: certification/security-clean-167d1e3-amd64

      - name: Prove branch and snapshot parent identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          uname -a
          test "$(uname -m)" = "x86_64"
          test "$(git branch --show-current)" = "certification/security-clean-167d1e3-amd64"
          git cat-file -e "$EXPECTED_SNAPSHOT_PARENT^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SNAPSHOT_PARENT" HEAD
          main_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_remote" = "f839849ec9157da640c75b369379b91e135903d5"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Verify source manifest and release-lock identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum certification-source-manifest.json | awk '{print $1}')" = "$EXPECTED_SOURCE_MANIFEST_SHA256"
          test "$(sha256sum Backend/requirements.production.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum Backend/requirements.production.metadata.json | awk '{print $1}')" = "$EXPECTED_METADATA_SHA256"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          manifest_path = pathlib.Path("certification-source-manifest.json")
          doc = json.loads(manifest_path.read_text("utf-8"))
          expected_source = os.environ["EXPECTED_PACKAGING_SOURCE_SHA"]
          if doc.get("packaging_source_sha") != expected_source:
              raise SystemExit("PACKAGING_SOURCE_SHA_MISMATCH")
          files = doc.get("files")
          if not isinstance(files, list) or len(files) != 344:
              raise SystemExit(f"UNEXPECTED_SOURCE_FILE_COUNT:{len(files) if isinstance(files, list) else 'invalid'}")
          for record in files:
              p = pathlib.Path(record["path"])
              if not p.is_file():
                  raise SystemExit(f"MISSING_SOURCE_FILE:{record['path']}")
              raw = p.read_bytes()
              if len(raw) != int(record["size"]):
                  raise SystemExit(f"SOURCE_SIZE_MISMATCH:{record['path']}")
              if hashlib.sha256(raw).hexdigest() != record["sha256"]:
                  raise SystemExit(f"SOURCE_HASH_MISMATCH:{record['path']}")
          forbidden = [
              "Backend/database/flowsignal.db",
              "Backend/data/ctrader_accounts.json",
              "Backend/data/live_backup.json",
              "Backend/data/paper_backup.json",
              "Backend/data/visits.json",
          ]
          for name in forbidden:
              if pathlib.Path(name).exists():
                  raise SystemExit(f"FORBIDDEN_RUNTIME_STATE_PRESENT:{name}")
          for p in pathlib.Path(".").rglob(".env"):
              raise SystemExit(f"ENV_FILE_PRESENT:{p}")
          print(f"verified_source_files={len(files)}")
          print(f"packaging_source_sha={expected_source}")
          PY

      - name: Set up Python 3.14.3 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: Backend/requirements.production.lock

      - name: Prove Python and platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform, sys
          print("python=" + sys.version.replace("\n", " "))
          print("machine=" + platform.machine())
          print("platform=" + platform.platform())
          assert sys.version_info[:3] == (3, 14, 3)
          assert platform.system() == "Linux"
          assert platform.machine() in {"x86_64", "AMD64"}
          PY

      - name: Prepare isolated runtime roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/flowsignal-certification"
          mkdir -p "$root/state" "$root/cache" "$root/tmp"
          chmod 700 "$root" "$root/state" "$root/cache" "$root/tmp"
          echo "FLOWSIGNAL_STATE_ROOT=$root/state" >> "$GITHUB_ENV"
          echo "FLOWSIGNAL_CACHE_ROOT=$root/cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"

      - name: Hash-only install into first clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-cert1
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input "pip==25.3"
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r Backend/requirements.production.lock

      - name: Verify exact 39-package installed profile
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import importlib.metadata as md, json, pathlib, re
          def norm(s):
              return re.sub(r"[-_.]+", "-", s).lower()
          meta = json.loads(pathlib.Path("Backend/requirements.production.metadata.json").read_text("utf-8"))
          expected = {norm(x["name"]): x["version"] for x in meta["packages"]}
          if len(expected) != 39:
              raise SystemExit(f"EXPECTED_PACKAGE_COUNT:{len(expected)}")
          installed = {norm(d.metadata["Name"]): d.version for d in md.distributions() if d.metadata.get("Name")}
          tooling = {"pip", "setuptools", "wheel"}
          app_installed = {k:v for k,v in installed.items() if k not in tooling}
          missing = sorted(set(expected) - set(app_installed))
          unexpected = sorted(set(app_installed) - set(expected))
          mismatched = sorted((k, expected[k], app_installed.get(k)) for k in expected if app_installed.get(k) != expected[k])
          if missing or unexpected or mismatched:
              raise SystemExit(f"PROFILE_MISMATCH missing={missing} unexpected={unexpected} mismatched={mismatched}")
          if app_installed.get("greenlet") != "3.5.6":
              raise SystemExit("GREENLET_VERSION_MISMATCH")
          pathlib.Path("installed-profile-1.json").write_text(json.dumps(app_installed, sort_keys=True, indent=2) + "\n")
          print("application_package_count=39")
          print("greenlet=3.5.6")
          print("unexpected_application_packages=0")
          PY

      - name: Native extension and shared-library checks
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import bcrypt
          import cffi
          import cryptography
          import greenlet
          import markupsafe
          import numpy
          import pandas
          import psycopg2
          import pydantic_core
          import sqlalchemy
          import websockets
          print("native_imports=ok")
          PY
          while IFS= read -r sofile; do
            if ldd "$sofile" 2>/dev/null | grep -q "not found"; then
              echo "missing shared library for $sofile" >&2
              ldd "$sofile" >&2 || true
              exit 1
            fi
          done < <(find .venv-cert1 -type f -name '*.so' -print)

      - name: SQLAlchemy, greenlet, and disposable PostgreSQL smoke
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import asyncio, os
          import greenlet
          from sqlalchemy import create_engine, text
          from sqlalchemy.util.concurrency import greenlet_spawn
          assert greenlet.__version__ == "3.5.6"
          assert asyncio.run(greenlet_spawn(lambda: 42)) == 42
          engine = create_engine(os.environ["VERIFIER_TEST_PG_DSN"])
          with engine.begin() as conn:
              assert conn.execute(text("select 1")).scalar_one() == 1
          engine.dispose()
          print("sqlalchemy_greenlet_postgres=ok")
          PY

      - name: Install pinned test tooling separately from profile check
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input "pytest==8.4.2"

      - name: FastAPI/application import smoke
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          ../.venv-cert1/bin/python - <<'PY'
          import api
          assert getattr(api, "app", None) is not None
          print("application_import=ok")
          PY

      - name: Safe Recovery and cutover behavioral recertification
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          ../.venv-cert1/bin/python -m pytest -q             tests/test_binding_decimal.py             tests/test_runtime_paths.py             tests/test_runtime_paths_postgres.py             tests/test_recovery_acceptance_crash.py             tests/test_recovery_accepted_execution.py             tests/test_recovery_entry_gate.py             tests/test_recovery_position_repair.py             tests/test_recovery_management_readiness.py             tests/test_recovery_explicit_context.py             tests/test_recovery_fencing.py             tests/test_recovery_lock_order.py             tests/test_recovery_combined_matrix.py             tests/test_task3_entry_integration.py             tests/test_cutover_manifest.py             tests/test_cutover_files.py             tests/test_cutover_postgres.py             tests/test_cutover_service.py             tests/test_cutover_cli.py             tests/test_cutover_first_start.py

      - name: Second clean hash-only install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-cert2
          .venv-cert2/bin/python -m pip install --disable-pip-version-check --no-input "pip==25.3"
          .venv-cert2/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r Backend/requirements.production.lock
          .venv-cert2/bin/python - <<'PY'
          import importlib.metadata as md, json, pathlib, re
          def norm(s):
              return re.sub(r"[-_.]+", "-", s).lower()
          meta = json.loads(pathlib.Path("Backend/requirements.production.metadata.json").read_text("utf-8"))
          expected = {norm(x["name"]): x["version"] for x in meta["packages"]}
          installed = {norm(d.metadata["Name"]): d.version for d in md.distributions() if d.metadata.get("Name")}
          tooling = {"pip", "setuptools", "wheel"}
          app_installed = {k:v for k,v in installed.items() if k not in tooling}
          if app_installed != expected:
              raise SystemExit("SECOND_INSTALL_PROFILE_MISMATCH")
          pathlib.Path("installed-profile-2.json").write_text(json.dumps(app_installed, sort_keys=True, indent=2) + "\n")
          print("second_clean_install=match")
          PY
          cmp installed-profile-1.json installed-profile-2.json

      - name: Final certification summary
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPENDENCY_CERTIFICATION=PASS"
          echo "PACKAGING_SOURCE_SHA=$EXPECTED_PACKAGING_SOURCE_SHA"
          echo "SOURCE_MANIFEST_SHA256=$EXPECTED_SOURCE_MANIFEST_SHA256"
          echo "LOCK_SHA256=$EXPECTED_LOCK_SHA256"
          echo "METADATA_SHA256=$EXPECTED_METADATA_SHA256"
          echo "LINUX_AMD64=PASS"
          echo "PYTHON_3_14_3=PASS"
          echo "PACKAGE_COUNT_39=PASS"
          echo "GREENLET_3_5_6=PASS"
          echo "REAL_BROKER_ORDERS_SENT=0"
