name: AMD64 dependency certification

on:
  push:
    branches:
      - certification/security-clean-167d1e3-amd64

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: certification/security-clean-167d1e3-amd64
          fetch-depth: 2

      - name: Prove runner architecture and source ancestry
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -m)" = "x86_64"
          git cat-file -e "2f3c933c35c4e0deaf0de97971b3ec9bf7b1d936^{commit}"
          git merge-base --is-ancestor 2f3c933c35c4e0deaf0de97971b3ec9bf7b1d936 HEAD
          test "$(git ls-remote origin refs/heads/main | awk '{print $1}')" = "f839849ec9157da640c75b369379b91e135903d5"
          echo "MINIMAL_CERTIFICATION_WORKFLOW=PASS"
