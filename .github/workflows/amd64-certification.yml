name: AMD64 dependency certification

on:
  push:
    branches:
      - certification/security-clean-167d1e3-amd64
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: amd64-certification-security-clean-167d1e3
  cancel-in-progress: false

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    env:
      EXPECTED_SNAPSHOT_PARENT: 2f3c933c35c4e0deaf0de97971b3ec9bf7b1d936
      EXPECTED_PACKAGING_SOURCE_SHA: 167d1e3a50de99a56fcb471c1c67b15838bc284b
      EXPECTED_SOURCE_MANIFEST_SHA256: 51e8540b1b2be9804ce2cbccbf753aa41c4f1eb041d7329312c29968a940af1b
      EXPECTED_LOCK_SHA256: 1d8e368b5645db69cab33479c56d7db0827155898368a419fc80ab9819ee5736
      EXPECTED_METADATA_SHA256: 8e24bda82fa3cc5bdcf21f19c86eec85eae74e24e115a402066bfafe884e5e89
      DATABASE_URL: "sqlite:///:memory:"
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      TZ: UTC
      JWT_SECRET_KEY: certification-jwt-test-only
      ADMIN_TOKEN: certification-admin-test-only
      TWELVE_DATA_API_KEY: certification-twelve-data-test-only
      STRATEGY_LIVE_INTEGRITY_VERIFY_ENABLED: "0"

    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: certification/security-clean-167d1e3-amd64

      - name: Prove branch and snapshot parent identity
        shell: bash
        run: |
          set -euo pipefail
          echo "runner_os=${RUNNER_OS}"
          uname -a
          test "$(uname -m)" = "x86_64"
          test "$(git branch --show-current)" = "certification/security-clean-167d1e3-amd64"
          git cat-file -e "$EXPECTED_SNAPSHOT_PARENT^{commit}"
          git merge-base --is-ancestor "$EXPECTED_SNAPSHOT_PARENT" HEAD
          main_remote="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test "$main_remote" = "f839849ec9157da640c75b369379b91e135903d5"
          git status --porcelain=v1
          test -z "$(git status --porcelain=v1)"

      - name: Verify source manifest and release-lock identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum certification-source-manifest.json | awk '{print $1}')" = "$EXPECTED_SOURCE_MANIFEST_SHA256"
          test "$(sha256sum Backend/requirements.production.lock | awk '{print $1}')" = "$EXPECTED_LOCK_SHA256"
          test "$(sha256sum Backend/requirements.production.metadata.json | awk '{print $1}')" = "$EXPECTED_METADATA_SHA256"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, sys
          manifest_path = pathlib.Path("certification-source-manifest.json")
          doc = json.loads(manifest_path.read_text("utf-8"))
          expected_source = os.environ["EXPECTED_PACKAGING_SOURCE_SHA"]
          if doc.get("packaging_source_sha") != expected_source:
              raise SystemExit("PACKAGING_SOURCE_SHA_MISMATCH")
          files = doc.get("files")
          if not isinstance(files, list) or len(files) != 344:
              raise SystemExit(f"UNEXPECTED_SOURCE_FILE_COUNT:{len(files) if isinstance(files, list) else 'invalid'}")
          for record in files:
              p = pathlib.Path(record["path"])
              if not p.is_file():
                  raise SystemExit(f"MISSING_SOURCE_FILE:{record['path']}")
              raw = p.read_bytes()
              if len(raw) != int(record["size"]):
                  raise SystemExit(f"SOURCE_SIZE_MISMATCH:{record['path']}")
              if hashlib.sha256(raw).hexdigest() != record["sha256"]:
                  raise SystemExit(f"SOURCE_HASH_MISMATCH:{record['path']}")
          forbidden = [
              "Backend/database/flowsignal.db",
              "Backend/data/ctrader_accounts.json",
              "Backend/data/live_backup.json",
              "Backend/data/paper_backup.json",
              "Backend/data/visits.json",
          ]
          for name in forbidden:
              if pathlib.Path(name).exists():
                  raise SystemExit(f"FORBIDDEN_RUNTIME_STATE_PRESENT:{name}")
          for p in pathlib.Path(".").rglob(".env"):
              raise SystemExit(f"ENV_FILE_PRESENT:{p}")
          print(f"verified_source_files={len(files)}")
          print(f"packaging_source_sha={expected_source}")
          PY

      - name: Set up Python 3.14.3 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.14.3"
          architecture: "x64"
          cache: "pip"
          cache-dependency-path: Backend/requirements.production.lock

      - name: Prove Python and platform
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import platform, sys
          print("python=" + sys.version.replace("\n", " "))
          print("machine=" + platform.machine())
          print("platform=" + platform.platform())
          assert sys.version_info[:3] == (3, 14, 3)
          assert platform.system() == "Linux"
          assert platform.machine() in {"x86_64", "AMD64"}
          PY

      - name: Prepare isolated runtime roots
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/flowsignal-certification"
          mkdir -p "$root/state" "$root/cache" "$root/tmp"
          chmod 700 "$root" "$root/state" "$root/cache" "$root/tmp"
          echo "FLOWSIGNAL_STATE_ROOT=$root/state" >> "$GITHUB_ENV"
          echo "FLOWSIGNAL_CACHE_ROOT=$root/cache" >> "$GITHUB_ENV"
          echo "TMPDIR=$root/tmp" >> "$GITHUB_ENV"

      - name: Hash-only install into first clean environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-cert1
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input "pip==25.3"
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r Backend/requirements.production.lock

      - name: Verify exact 39-package installed profile
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import importlib.metadata as md, json, pathlib, re
          def norm(s):
              return re.sub(r"[-_.]+", "-", s).lower()
          meta = json.loads(pathlib.Path("Backend/requirements.production.metadata.json").read_text("utf-8"))
          expected = {norm(x["name"]): x["version"] for x in meta["packages"]}
          if len(expected) != 39:
              raise SystemExit(f"EXPECTED_PACKAGE_COUNT:{len(expected)}")
          installed = {norm(d.metadata["Name"]): d.version for d in md.distributions() if d.metadata.get("Name")}
          tooling = {"pip", "setuptools", "wheel"}
          app_installed = {k:v for k,v in installed.items() if k not in tooling}
          missing = sorted(set(expected) - set(app_installed))
          unexpected = sorted(set(app_installed) - set(expected))
          mismatched = sorted((k, expected[k], app_installed.get(k)) for k in expected if app_installed.get(k) != expected[k])
          if missing or unexpected or mismatched:
              raise SystemExit(f"PROFILE_MISMATCH missing={missing} unexpected={unexpected} mismatched={mismatched}")
          if app_installed.get("greenlet") != "3.5.6":
              raise SystemExit("GREENLET_VERSION_MISMATCH")
          pathlib.Path("installed-profile-1.json").write_text(json.dumps(app_installed, sort_keys=True, indent=2) + "\n")
          print("application_package_count=39")
          print("greenlet=3.5.6")
          print("unexpected_application_packages=0")
          PY

      - name: Native extension and shared-library checks
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import bcrypt
          import cffi
          import cryptography
          import greenlet
          import markupsafe
          import numpy
          import pandas
          import psycopg2
          import pydantic_core
          import sqlalchemy
          import websockets
          print("native_imports=ok")
          PY
          while IFS= read -r sofile; do
            if ldd "$sofile" 2>/dev/null | grep -q "not found"; then
              echo "missing shared library for $sofile" >&2
              ldd "$sofile" >&2 || true
              exit 1
            fi
          done < <(find .venv-cert1 -type f -name '*.so' -print)

      - name: Start job-owned disposable PostgreSQL Unix socket
        shell: bash
        run: |
          set -euo pipefail
          pg_bin=/usr/lib/postgresql/16/bin
          test -x "$pg_bin/initdb"
          test "$(id -u)" -ne 0
          pg_root=$(mktemp -d /tmp/fs-verifier-pg.XXXXXXXX)
          test "$(realpath "$pg_root")" = "$pg_root"
          test ! -L /tmp
          test -z "$(find "$pg_root" -mindepth 1 -print -quit)"
          chmod 700 "$pg_root"
          echo "CERT_PG_ROOT=$pg_root" >> "$GITHUB_ENV"
          echo "CERT_PG_BIN=$pg_bin" >> "$GITHUB_ENV"
          "$pg_bin/initdb" -D "$pg_root/data" -U verifier_test -A trust --no-locale >/dev/null
          "$pg_bin/pg_ctl" -D "$pg_root/data" -o "-k $pg_root -p 55443 -h ''" -l "$pg_root/server.log" start -w
          "$pg_bin/createdb" -h "$pg_root" -p 55443 -U verifier_test verifier_test
          pg_pid=$(head -n 1 "$pg_root/data/postmaster.pid")
          test "$(ps -o uid= -p "$pg_pid" | tr -d ' ')" = "$(id -u)"
          test -S "$pg_root/.s.PGSQL.55443"
          dsn="postgresql+psycopg2://verifier_test@/verifier_test?host=$pg_root&port=55443"
          echo "VERIFIER_TEST_PG_DSN=$dsn" >> "$GITHUB_ENV"
          echo "CUTOVER_DATABASE_URL=$dsn" >> "$GITHUB_ENV"
          echo "disposable_pg_fresh_root=$pg_root"
          echo "disposable_pg_job_owner_uid=$(id -u)"
          echo "disposable_pg_pid=$pg_pid"

      - name: SQLAlchemy, greenlet, and disposable PostgreSQL smoke
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python - <<'PY'
          import asyncio, os
          import greenlet
          from sqlalchemy import create_engine, text
          from sqlalchemy.util.concurrency import greenlet_spawn
          assert greenlet.__version__ == "3.5.6"
          assert asyncio.run(greenlet_spawn(lambda: 42)) == 42
          engine = create_engine(os.environ["VERIFIER_TEST_PG_DSN"])
          assert os.environ["CUTOVER_DATABASE_URL"] == os.environ["VERIFIER_TEST_PG_DSN"]
          assert 'host=/tmp/fs-verifier-pg.' in os.environ['VERIFIER_TEST_PG_DSN']
          assert '/verifier_test?' in os.environ['VERIFIER_TEST_PG_DSN']
          with engine.begin() as conn:
              assert conn.execute(text("select 1")).scalar_one() == 1
              assert conn.execute(text("select current_database()")).scalar_one() == 'verifier_test'
              assert conn.execute(text("select current_user")).scalar_one() == 'verifier_test'
              assert conn.execute(text("select inet_server_addr()")).scalar_one() is None
              assert conn.execute(text("show listen_addresses")).scalar_one() == ''
              assert conn.execute(text("show data_directory")).scalar_one() == os.environ['CERT_PG_ROOT'] + '/data'
          engine.dispose()
          print("sqlalchemy_greenlet_postgres=ok")
          PY

      - name: Install pinned test tooling separately from profile check
        shell: bash
        run: |
          set -euo pipefail
          .venv-cert1/bin/python -m pip install --disable-pip-version-check --no-input "pytest==8.4.2"

      - name: FastAPI/application import smoke
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          ../.venv-cert1/bin/python - <<'PY'
          import api
          assert getattr(api, "app", None) is not None
          print("application_import=ok")
          PY

      - name: Prepare disposable UID 501 access
        shell: bash
        run: |
          set -euo pipefail
          command -v setfacl
          getent group 1000 >/dev/null || sudo groupadd --gid 1000 certcutovergroup
          if ! getent passwd 501 >/dev/null; then
            sudo useradd --uid 501 --gid 1000 --no-create-home --shell /usr/sbin/nologin certcutover501
          fi
          cert_user=$(getent passwd 501 | cut -d: -f1)
          # Existing fixtures need only sudo unshare for private read-only bind mounts.
          printf '%s ALL=(root) NOPASSWD: /usr/bin/unshare\n' "$cert_user" | sudo tee /etc/sudoers.d/certification-uid501 >/dev/null
          sudo chmod 440 /etc/sudoers.d/certification-uid501
          sudo visudo -cf /etc/sudoers.d/certification-uid501
          export CERT_RUNNER_UID=$(id -u)
          python - <<'PY'
          import os,pathlib,subprocess
          root=pathlib.Path.cwd().resolve()
          # Traverse ancestors only; do not grant listing/access to unrelated home state.
          targets=[root,root/'.venv-cert1',pathlib.Path(os.environ['pythonLocation'])]
          parents=set(p for target in targets for p in target.parents if p!=pathlib.Path('/'))
          for p in sorted(parents,key=lambda p:len(p.parts)):
              subprocess.run(['sudo','setfacl','-m','u:501:--x',str(p)],check=True)
          for p in [root/'Backend',root/'.venv-cert1',pathlib.Path(os.environ['pythonLocation'])]:
              subprocess.run(['sudo','setfacl','-R','-P','-m','u:501:rX',str(p)],check=True)
          subprocess.run(['sudo','setfacl','-m','u:501:--x',str(root)],check=True)
          # Never recurse into PostgreSQL's data directory.
          pg=pathlib.Path(os.environ['CERT_PG_ROOT'])
          subprocess.run(['setfacl','-m','u:501:--x',str(pg)],check=True)
          assert (pg/'data').stat().st_mode & 0o077 == 0
          PY
          cert_root=$(mktemp -d /tmp/fs-certification-uid501.XXXXXXXX)
          sudo chown 501:1000 "$cert_root"
          sudo chmod 700 "$cert_root"
          sudo setfacl -m "u:$(id -u):r-x" "$cert_root"
          sudo setpriv --reuid=501 --regid=1000 --clear-groups mkdir -m 700 "$cert_root/state" "$cert_root/cache" "$cert_root/tmp"
          echo "CERT_UID_ROOT=$cert_root" >> "$GITHUB_ENV"

      - name: UID 501 access preflight
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          cert_python=$(realpath -s ../.venv-cert1/bin/python)
          sudo setpriv --reuid=501 --regid=1000 --clear-groups env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC PYTHONDONTWRITEBYTECODE=1 PYTHON_DOTENV_DISABLED=1 \
            CUTOVER_DATABASE_URL="$CUTOVER_DATABASE_URL" VERIFIER_TEST_PG_DSN="$VERIFIER_TEST_PG_DSN" \
            CERT_PG_ROOT="$CERT_PG_ROOT" "$cert_python" -B - <<'PY'
          import importlib,os,pathlib,sys
          assert os.getuid()==501 and os.getgid()==1000 and os.getgroups()==[]
          assert os.access(sys.executable,os.X_OK) and sys.version_info[:3]==(3,14,3)
          assert not os.access(pathlib.Path('startup_recovery/cutover.py'),os.W_OK)
          for name in ('startup_recovery.cutover','startup_recovery.cutover_service','startup_recovery.cutover_validation'):
              importlib.import_module(name)
          assert not os.access(pathlib.Path(os.environ['CERT_PG_ROOT'])/'data',os.R_OK)
          from sqlalchemy import create_engine,text
          assert os.environ['CUTOVER_DATABASE_URL']==os.environ['VERIFIER_TEST_PG_DSN']
          engine=create_engine(os.environ['VERIFIER_TEST_PG_DSN'])
          with engine.connect() as c:
              assert c.execute(text('select current_database()')).scalar_one()=='verifier_test'
              assert c.execute(text('select inet_server_addr()')).scalar_one() is None
          engine.dispose()
          print('UID_501_PYTHON_ACCESS=PASS')
          print('UID_501_SOURCE_ACCESS=PASS')
          print('UID_501_POSTGRES_SOCKET_ACCESS=PASS')
          print('POSTGRES_DATA_REMAINS_PRIVATE=PASS')
          PY
          sudo setpriv --reuid=501 --regid=1000 --clear-groups sudo -n unshare --mount --propagation private -- true

      - name: Safe Recovery and cutover behavioral recertification
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          cert_python=$(realpath -s ../.venv-cert1/bin/python)
          sudo setpriv --reuid=501 --regid=1000 --clear-groups env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 TZ=UTC PYTHONDONTWRITEBYTECODE=1 PYTHON_DOTENV_DISABLED=1 \
            DATABASE_URL="$DATABASE_URL" VERIFIER_TEST_PG_DSN="$VERIFIER_TEST_PG_DSN" CUTOVER_DATABASE_URL="$CUTOVER_DATABASE_URL" \
            TMPDIR="$CERT_UID_ROOT/tmp" FLOWSIGNAL_STATE_ROOT="$CERT_UID_ROOT/state" FLOWSIGNAL_CACHE_ROOT="$CERT_UID_ROOT/cache" \
            STRATEGY_LIVE_INTEGRITY_VERIFY_ENABLED=0 \
            "$cert_python" -B -m pytest -q -p no:cacheprovider --junitxml="$CERT_UID_ROOT/certification-behavioral.xml" tests/test_binding_decimal.py tests/test_runtime_paths.py tests/test_runtime_paths_postgres.py tests/test_recovery_acceptance_crash.py tests/test_recovery_accepted_execution.py tests/test_recovery_entry_gate.py tests/test_recovery_position_repair.py tests/test_recovery_management_readiness.py tests/test_recovery_explicit_context.py tests/test_recovery_fencing.py tests/test_recovery_lock_order.py tests/test_recovery_combined_matrix.py tests/test_task3_entry_integration.py tests/test_cutover_manifest.py tests/test_cutover_files.py tests/test_cutover_postgres.py tests/test_cutover_service.py tests/test_cutover_cli.py tests/test_cutover_first_start.py

      - name: Assert behavioral certification has no required skips
        working-directory: Backend
        shell: bash
        run: |
          set -euo pipefail
          ../.venv-cert1/bin/python - <<'PY'
          import xml.etree.ElementTree as ET
          import os
          doc=ET.parse(os.environ['CERT_UID_ROOT']+'/certification-behavioral.xml')
          assert len(doc.findall('.//testcase'))==567
          assert not doc.findall('.//failure') and not doc.findall('.//error') and not doc.findall('.//skipped')
          print('behavioral_tests_passed=' + str(len(doc.findall('.//testcase'))))
          PY

      - name: Second clean hash-only install
        shell: bash
        run: |
          set -euo pipefail
          python -m venv .venv-cert2
          .venv-cert2/bin/python -m pip install --disable-pip-version-check --no-input "pip==25.3"
          .venv-cert2/bin/python -m pip install --disable-pip-version-check --no-input --require-hashes --only-binary=:all: -r Backend/requirements.production.lock
          .venv-cert2/bin/python - <<'PY'
          import importlib.metadata as md, json, pathlib, re
          def norm(s):
              return re.sub(r"[-_.]+", "-", s).lower()
          meta = json.loads(pathlib.Path("Backend/requirements.production.metadata.json").read_text("utf-8"))
          expected = {norm(x["name"]): x["version"] for x in meta["packages"]}
          installed = {norm(d.metadata["Name"]): d.version for d in md.distributions() if d.metadata.get("Name")}
          tooling = {"pip", "setuptools", "wheel"}
          app_installed = {k:v for k,v in installed.items() if k not in tooling}
          if app_installed != expected:
              raise SystemExit("SECOND_INSTALL_PROFILE_MISMATCH")
          pathlib.Path("installed-profile-2.json").write_text(json.dumps(app_installed, sort_keys=True, indent=2) + "\n")
          print("second_clean_install=match")
          PY
          cmp installed-profile-1.json installed-profile-2.json

      - name: Clean up job-owned disposable PostgreSQL
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CERT_PG_ROOT:-}" ] && [ -f "$CERT_PG_ROOT/data/postmaster.pid" ]; then
            "$CERT_PG_BIN/pg_ctl" -D "$CERT_PG_ROOT/data" stop -m fast -w
            test ! -f "$CERT_PG_ROOT/data/postmaster.pid"
            test ! -S "$CERT_PG_ROOT/.s.PGSQL.55443"
            echo "disposable_pg_cleanup=PASS"
          fi
          if [ -f /etc/sudoers.d/certification-uid501 ]; then
            sudo unlink /etc/sudoers.d/certification-uid501
          fi

      - name: Final certification summary
        shell: bash
        run: |
          set -euo pipefail
          echo "DEPENDENCY_CERTIFICATION=PASS"
          echo "PACKAGING_SOURCE_SHA=$EXPECTED_PACKAGING_SOURCE_SHA"
          echo "SOURCE_MANIFEST_SHA256=$EXPECTED_SOURCE_MANIFEST_SHA256"
          echo "LOCK_SHA256=$EXPECTED_LOCK_SHA256"
          echo "METADATA_SHA256=$EXPECTED_METADATA_SHA256"
          echo "LINUX_AMD64=PASS"
          echo "PYTHON_3_14_3=PASS"
          echo "PACKAGE_COUNT_39=PASS"
          echo "GREENLET_3_5_6=PASS"
          echo "REAL_BROKER_ORDERS_SENT=0"
